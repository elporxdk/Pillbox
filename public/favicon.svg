<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="MEDIBOT">
  <title>MEDIBOT</title>
  <!--
    La rueda de MEDIBOT: los mismos 8 sectores que src/components/MedibotLogo.tsx.

    NO ESTA ESCRITO A MANO. Los paths se generaron ejecutando las mismas formulas
    del componente con sus mismas constantes (GAP_DEG 8, SEGMENTS 8, OUTER_R 46,
    INNER_R 20), asi que la marca de la pestana y la del sitio son el mismo dibujo
    y no dos parecidos.

    SI EL LOGO CAMBIA, HAY QUE REGENERAR ESTE FICHERO. Es la unica copia de esa
    geometria fuera del componente, y no hay nada que avise si se separan. Se
    regenera recorriendo SECTOR_PATHS de MedibotLogo.tsx y volcando cada `d`.

    POR QUE EL COLOR VA FIJO Y NO EN UN TOKEN
    El componente usa var(--c-brandsoft), pero un favicon se carga fuera de la
    pagina: no hay CSS del sitio ni variables que resolver. Aqui el color tiene
    que ser literal.

    POR QUE HAY DOS COLORES
    El #5ee1e6 del logo es un cian claro; sobre la barra de pestanas blanca casi
    no se ve. Los SVG de favicon si respetan prefers-color-scheme, asi que se usa
    el cian intenso de marca en claro y el suave en oscuro. Cada uno contra su
    propio fondo.
  -->
  <style>
    path { fill: #01baef; }
    @media (prefers-color-scheme: dark) {
      path { fill: #7fe9ed; }
    }
  </style>
  <g>
    <path d="M 53.209 4.112 A 46 46 0 0 1 80.179 15.283 L 63.121 34.906 A 20 20 0 0 0 51.395 30.049 Z" />
    <path d="M 84.717 19.821 A 46 46 0 0 1 95.888 46.791 L 69.951 48.605 A 20 20 0 0 0 65.094 36.879 Z" />
    <path d="M 95.888 53.209 A 46 46 0 0 1 84.717 80.179 L 65.094 63.121 A 20 20 0 0 0 69.951 51.395 Z" />
    <path d="M 80.179 84.717 A 46 46 0 0 1 53.209 95.888 L 51.395 69.951 A 20 20 0 0 0 63.121 65.094 Z" />
    <path d="M 46.791 95.888 A 46 46 0 0 1 19.821 84.717 L 36.879 65.094 A 20 20 0 0 0 48.605 69.951 Z" />
    <path d="M 15.283 80.179 A 46 46 0 0 1 4.112 53.209 L 30.049 51.395 A 20 20 0 0 0 34.906 63.121 Z" />
    <path d="M 4.112 46.791 A 46 46 0 0 1 15.283 19.821 L 34.906 36.879 A 20 20 0 0 0 30.049 48.605 Z" />
    <path d="M 19.821 15.283 A 46 46 0 0 1 46.791 4.112 L 48.605 30.049 A 20 20 0 0 0 36.879 34.906 Z" />
  </g>
</svg>

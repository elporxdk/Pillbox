name: Deploy to GitHub Pages

on:
  push:
    branches: [web]
  workflow_dispatch:

# Permisos que necesita el despliegue oficial de Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Un despliegue a la vez; no cancelamos el que ya esta corriendo.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Build
        # Vite hornea las VITE_* dentro del bundle: tienen que existir aqui,
        # en build, no en runtime. Son claves de cliente (la anon key de
        # Supabase es publica por diseno y se protege con RLS en la base),
        # pero se inyectan desde los secrets del repo para no volver a
        # commitear el .env.
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: npm run build

      - name: Fallback SPA para rutas profundas
        # Pages sirve ficheros estaticos: al entrar directo a /tecnologia no
        # existe ese fichero y devuelve 404. Copiando index.html a 404.html
        # (ya con los assets hasheados del build) react-router recoge la ruta.
        run: cp dist/index.html dist/404.html

      - name: Comprobar que el CNAME viaja en el artefacto
        # Si el CNAME no acaba dentro de dist/, cada despliegue borra el
        # dominio personalizado en los ajustes de Pages y Cloudflare se queda
        # apuntando a un sitio sin dominio.
        run: test -f dist/CNAME && cat dist/CNAME

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
